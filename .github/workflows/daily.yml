name: daily-report

on:
  schedule:
    # Asia/Bangkok 10:17, 10:47, 11:17, 11:47, after the 18 UTC WRFDA run is published (~10:00 ICT).
    # GitHub can delay or drop scheduled runs, so later slots are retries; a run exits early once today's
    # report has been sent (reports/sent_<date>.txt). Only the last slot may fall back to an older run.
    - cron: "17 3 * * *"
    - cron: "47 3 * * *"
    - cron: "17 4 * * *"
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Forecast date YYYY-MM-DD (blank = today, Asia/Bangkok)"
        required: false
      notify:
        description: "Send the image to LINE"
        type: boolean
        default: true
      auto:
        description: "External scheduler call: wait for the 18 UTC run and skip if already sent today"
        type: boolean
        default: false
      final:
        description: "Last scheduled attempt: allow fallback to an older run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v5

      - name: Resolve date
        id: when
        run: |
          D="${{ inputs.date }}"
          D="${D:-$(date +%F)}"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          SENT=false
          [ -f "reports/sent_$D.txt" ] && SENT=true
          echo "already_sent=$SENT" >> "$GITHUB_OUTPUT"

      - name: Wait for the 18 UTC run
        id: ready
        run: |
          RUN="$(date -d "${{ steps.when.outputs.date }} -1 day" +%Y%m%d)18"
          CODE=$(curl -sk -o /dev/null -w '%{http_code}' -r 0-0 "https://hpc.tmd.go.th/static/netcdf/$RUN/$RUN.prec1hr.d02.nc")
          READY=false
          [ "$CODE" = "206" ] || [ "$CODE" = "200" ] && READY=true
          AUTO=false
          [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ] && AUTO=true
          [ "$AUTO" = "false" ] && READY=true
          [ "${{ github.event.schedule }}" = "47 4 * * *" ] || [ "${{ inputs.final }}" = "true" ] && READY=true
          [ "${{ steps.when.outputs.already_sent }}" = "true" ] && [ "$AUTO" = "true" ] && READY=false
          echo "run $RUN http=$CODE ready=$READY already_sent=${{ steps.when.outputs.already_sent }}"
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: ${{ steps.ready.outputs.ready == 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Build report
        id: build
        if: ${{ steps.ready.outputs.ready == 'true' }}
        run: |
          pip install -r requirements.txt
          python build_report.py --date "${{ steps.when.outputs.date }}"

      - name: Commit report images
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/*.png reports/*.jpg
          git commit -m "report: ${{ steps.when.outputs.date }}" || echo "no changes"
          git push

      - name: Send to LINE
        if: ${{ steps.build.outcome == 'success' && (github.event_name == 'schedule' || inputs.auto || inputs.notify) }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          sleep 20
          python notify_line.py --date "${{ steps.when.outputs.date }}"
          date '+%F %T %Z' > "reports/sent_${{ steps.when.outputs.date }}.txt"
          git add reports/sent_*.txt
          git commit -m "sent: ${{ steps.when.outputs.date }}"
          git push

      - name: Notify failure
        if: ${{ failure() }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python3 -m pip install --quiet requests
          python3 notify_line.py --failed --date "${{ steps.when.outputs.date }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
