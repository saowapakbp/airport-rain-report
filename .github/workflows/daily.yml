name: daily-report

on:
  schedule:
    # Asia/Bangkok every 15 min 05:00-06:45 (UTC 22:00-23:45 of the previous day). GitHub gives no timing
    # guarantee for cron, so cron-job.org is the primary trigger and these slots are a backup; the first run
    # that gets the 12 UTC data sends, later runs see reports/sent_<date>.txt and stop.
    - cron: "0 22 * * *"
    - cron: "15 22 * * *"
    - cron: "30 22 * * *"
    - cron: "45 22 * * *"
    - cron: "0 23 * * *"
    - cron: "15 23 * * *"
    - cron: "30 23 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Forecast date YYYY-MM-DD (blank = today, Asia/Bangkok)"
        required: false
      notify:
        description: "Send the image to LINE"
        type: boolean
        default: true
      auto:
        description: "External scheduler call: wait for the 12 UTC run and skip if already sent today"
        type: boolean
        default: false
      final:
        description: "Last scheduled attempt: allow fallback to an older run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v5

      - name: Resolve date
        id: when
        run: |
          D="${{ inputs.date }}"
          D="${D:-$(date +%F)}"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          SENT=false
          [ -f "reports/sent_$D.txt" ] && SENT=true
          echo "already_sent=$SENT" >> "$GITHUB_OUTPUT"

      - name: Wait for the 12 UTC run
        id: ready
        run: |
          RUN="$(date -d "${{ steps.when.outputs.date }} -1 day" +%Y%m%d)12"
          URL="https://hpc.tmd.go.th/static/netcdf/$RUN/$RUN.prec1hr.d02.nc"
          AUTO=false
          [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ] && AUTO=true
          [ "$AUTO" = "true" ] && [ "${{ steps.when.outputs.already_sent }}" = "true" ] && { echo "already sent"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$AUTO" = "false" ] && { echo "manual run"; echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # poll up to 40 min for the 12 UTC file; an older run is allowed only after 06:30 ICT or on the final call,
          # otherwise this run stops without sending and a later slot tries again
          READY=false
          for i in $(seq 1 20); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' -r 0-0 "$URL")
            echo "$(date +%T) $RUN http=$CODE"
            [ "$CODE" = "206" ] || [ "$CODE" = "200" ] && { READY=true; break; }
            [ "$(date +%H%M)" -ge 630 ] || [ "${{ inputs.final }}" = "true" ] && { READY=true; echo "fallback allowed"; break; }
            sleep 120
          done
          echo "ready=$READY"
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: ${{ steps.ready.outputs.ready == 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Build report
        id: build
        if: ${{ steps.ready.outputs.ready == 'true' }}
        run: |
          pip install -r requirements.txt
          python build_report.py --date "${{ steps.when.outputs.date }}"

      - name: Commit report images
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/*.png reports/*.jpg
          git commit -m "report: ${{ steps.when.outputs.date }}" || echo "no changes"
          git push

      - name: Send to LINE
        if: ${{ steps.build.outcome == 'success' && (github.event_name == 'schedule' || inputs.auto || inputs.notify) }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          sleep 20
          python notify_line.py --date "${{ steps.when.outputs.date }}"
          date '+%F %T %Z' > "reports/sent_${{ steps.when.outputs.date }}.txt"
          git add reports/sent_*.txt
          git commit -m "sent: ${{ steps.when.outputs.date }}"
          git push

      - name: Notify failure
        if: ${{ failure() }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python3 -m pip install --quiet requests
          python3 notify_line.py --failed --date "${{ steps.when.outputs.date }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
